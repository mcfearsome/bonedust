name: Bonedust

options:
  bundleIdPrefix: dev.mcfearsome
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  BonedustCore:
    path: BonedustCore

targets:
  Bonedust:
    type: application
    platform: iOS
    sources:
      - path: Bonedust
    dependencies:
      - package: BonedustCore
        product: BonedustCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mcfearsome.bonedust
        PRODUCT_NAME: Bonedust
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    info:
      path: Bonedust/Info.plist
      properties:
        CFBundleDisplayName: Bonedust
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: true
        UIStatusBarHidden: false
        # Portrait only. The slab is 3:4 and brushing is a thumb gesture, so
        # landscape would mean either letterboxing or a different game.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        ITSAppUsesNonExemptEncryption: false
        # The crew ledger. api.bonedust.app in release; the apex is left for a marketing
        # page. A debug build can be pointed at a local server by editing this.
        BonedustLedgerBaseURL: "https://api.bonedust.app"
        # App Attest identifies the app as teamID.bundleID. Filled in once the team is
        # known; until then the server skips the relying-party check.
        BonedustAppAttestAppID: ""
      debug:
        BonedustLedgerBaseURL: "https://api.bonedust.app"

  BonedustTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BonedustTests
    dependencies:
      - target: Bonedust
      - package: BonedustCore
        product: BonedustCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Bonedust:
    build:
      targets:
        Bonedust: all
        BonedustTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BonedustTests
