name: Bonedust

options:
  bundleIdPrefix: dev.mcfearsome
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  BonedustCore:
    path: BonedustCore

targets:
  Bonedust:
    type: application
    platform: iOS
    sources:
      - path: Bonedust
    dependencies:
      - package: BonedustCore
        product: BonedustCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mcfearsome.bonedust
        PRODUCT_NAME: Bonedust
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    info:
      path: Bonedust/Info.plist
      properties:
        CFBundleDisplayName: Bonedust
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        # Bundle-relative: Resources/Fonts is flattened into the bundle root. Bold is
        # listed on purpose, Typography.number picks it by name for semibold and up.
        UIAppFonts:
          - RubikDirt-Regular.ttf
          - CourierPrime-Regular.ttf
          - CourierPrime-Bold.ttf
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: true
        UIStatusBarHidden: false
        # Portrait only. The slab is 3:4 and brushing is a thumb gesture, so
        # landscape would mean either letterboxing or a different game.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        ITSAppUsesNonExemptEncryption: false

  BonedustTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BonedustTests
    dependencies:
      - target: Bonedust
      - package: BonedustCore
        product: BonedustCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  # Real touches against the real app. Black-box, so it depends on the app target only to launch
  # it, and not on BonedustCore. See BonedustUITests/README.md for why it exists.
  BonedustUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BonedustUITests
        excludes:
          - "**/*.md"
    dependencies:
      - target: Bonedust
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Bonedust:
    build:
      targets:
        Bonedust: all
        BonedustTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BonedustTests

  # A scheme of its own, so `Bonedust` (which `make app` and `make test-app` use) neither builds
  # nor runs the UI tests. They are real-time and need a simulator: `make test-ui`.
  BonedustUI:
    build:
      targets:
        Bonedust: all
        BonedustUITests: [test]
    test:
      config: Debug
      targets:
        - BonedustUITests
