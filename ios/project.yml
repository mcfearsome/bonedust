name: Bonedust

options:
  bundleIdPrefix: dev.codenerd
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Read from the signing certificates' OU, which is the authoritative Team ID
    # (the parenthetical in a development cert's common name is the user id).
    DEVELOPMENT_TEAM: VHH2P6SR8R
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  BonedustCore:
    path: BonedustCore

targets:
  Bonedust:
    type: application
    platform: iOS
    sources:
      - path: Bonedust
    dependencies:
      - package: BonedustCore
        product: BonedustCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.codenerd.bonedust
        PRODUCT_NAME: Bonedust
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        CODE_SIGN_ENTITLEMENTS: Bonedust/Bonedust.entitlements
    info:
      path: Bonedust/Info.plist
      properties:
        CFBundleDisplayName: Bonedust
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: true
        UIStatusBarHidden: false
        # Portrait only. The slab is 3:4 and brushing is a thumb gesture, so
        # landscape would mean either letterboxing or a different game.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        ITSAppUsesNonExemptEncryption: false
        # The crew ledger. api.bonedust.app in release; the apex is left for a marketing
        # page. A debug build can be pointed at a local server by editing this.
        BonedustLedgerBaseURL: "https://api.bonedust.app"
        # App Attest identifies the app as teamID.bundleID. The server hashes this to
        # check the relying party, and refuses to boot in production without the matching
        # APP_ATTEST_APP_ID set -- so this string and the server's env var move together,
        # and a mismatch is a total attestation outage rather than a degraded one.
        #
        # VHH2P6SR8R is the personal membership, and it stays: Bonedust is published by
        # Code Nerd LLC but signed by the individual team. Those are independent -- the
        # bundle id does not have to match the team's name, and App Attest only cares that
        # this string is the team actually signing the binary.
        #
        # If the LLC ever takes its own membership, that is a different Team ID and this
        # line, DEVELOPMENT_TEAM, and the server's APP_ATTEST_APP_ID all move together.
        # `make team-id` prints what the installed certificates actually say.
        BonedustAppAttestAppID: "VHH2P6SR8R.dev.codenerd.bonedust"
      debug:
        BonedustLedgerBaseURL: "https://api.bonedust.app"

  BonedustTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BonedustTests
    dependencies:
      - target: Bonedust
      - package: BonedustCore
        product: BonedustCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Bonedust:
    build:
      targets:
        Bonedust: all
        BonedustTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BonedustTests
